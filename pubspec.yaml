name: badminton_accessories_shop
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_bloc: ^9.1.0
  go_router: ^15.1.1
  flutter_screenutil: ^5.9.3
  equatable: ^2.0.7
  flutter_secure_storage: ^9.2.4
  firebase_core: ^3.13.0
  provider: ^6.1.4
  flutter_svg: ^2.1.0
  jwt_decoder: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-VariableFont_opsz,wght.ttf
          weight: 100
        - asset: fonts/Inter-VariableFont_opsz,wght.ttf
          weight: 200
        - asset: fonts/Inter-VariableFont_opsz,wght.ttf
          weight: 300
        - asset: fonts/Inter-VariableFont_opsz,wght.ttf
          weight: 400
        - asset: fonts/Inter-VariableFont_opsz,wght.ttf
          weight: 500
        - asset: fonts/Inter-VariableFont_opsz,wght.ttf
          weight: 600
        - asset: fonts/Inter-VariableFont_opsz,wght.ttf
          weight: 700
        - asset: fonts/Inter-VariableFont_opsz,wght.ttf
          weight: 800
        - asset: fonts/Inter-VariableFont_opsz,wght.ttf
          weight: 900
        - asset: fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          weight: 100
          style: italic
        - asset: fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          weight: 200
          style: italic
        - asset: fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          weight: 300
          style: italic
        - asset: fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          weight: 400
          style: italic
        - asset: fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          weight: 500
          style: italic
        - asset: fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          weight: 600
          style: italic
        - asset: fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          weight: 700
